<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="../assets/css/index1.css">
</head>
<body>
  <div class="login">
    <h2>Inscription</h2>
    <form id="form" action="inscription_traitement.php" method="post">
      <div class="input-box">
        <div class="input-field">
          <input type="text" name="nom" placeholder="Nom">
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-field">
          <input type="text" name="prenom" placeholder="Prénom">
          <i class='bx bxs-user'></i>
        </div>
      </div>
      <div class="input-box">
        <div class="input-field">
          <input type="text" name="username" placeholder="Pseudo">
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-field">
          <input type="text" name="mail" placeholder="Adresse électronique">
          <i class='bx bxl-gmail'></i>
        </div>
      </div>
      <div class="input-box">
        <div class="input-field">
          <input type="password" name="password" placeholder="Mot de passe">
          <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="input-field">
          <input type="password" name="password_conf" placeholder="Confirmez le mot de passe">
          <i class='bx bxs-lock-alt'></i>
        </div>
      </div>
      <div class="input-box">
        <button class="btn-rigester" type="submit">S'inscrire</button>
      </div>
      <label><a class="inscription" href="connexion.html">Déjà inscrit ? Connecte-toi</a></label>
    </form>
  </div>
</body>
</html>
